name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test imports
        shell: python
        run: |
          from registry import TOOLS, load_tool_class
          import PySide6, cv2, numpy, yaml

          print("PySide6", PySide6.__version__)
          print("OpenCV", cv2.__version__)
          print("NumPy", numpy.__version__)
          print("PyYAML", yaml.__version__)

          for entry in TOOLS:
              cls = load_tool_class(entry)
              print("OK", entry["module"], entry["class"], cls)

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm toolbox.spec

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ToolsBox.exe
          generate_release_notes: true
