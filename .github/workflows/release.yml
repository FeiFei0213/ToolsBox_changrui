name: Build Windows EXE

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate build metadata
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "dev-${env:GITHUB_SHA}".Substring(0, 11)
          }
          @"
          """Generated by GitHub Actions."""
          __version__ = "$version"
          __commit__ = "${env:GITHUB_SHA}"
          "@ | Set-Content -Path build_info.py -Encoding utf8

      - name: Validate source
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q .
          python main.py --smoke-test

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm toolbox.spec

      - name: Validate packaged EXE
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process `
            -FilePath "${{ github.workspace }}\dist\ToolsBox.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            $logs = @(
              (Join-Path $env:LOCALAPPDATA "ToolsBox\toolbox.log"),
              (Join-Path $HOME ".toolbox\toolbox.log"),
              (Join-Path $env:TEMP "ToolsBox\toolbox.log")
            )
            foreach ($log in $logs) {
              if (Test-Path $log) {
                Get-Content $log
              }
            }
            throw "Packaged EXE smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Prepare distributable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\ToolsBox.exe package\ToolsBox.exe
          $hash = (Get-FileHash package\ToolsBox.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ToolsBox.exe" | Set-Content package\SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolsBox-Windows-x64-${{ github.run_number }}
          path: package/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload tagged build to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: package/*
          generate_release_notes: true
